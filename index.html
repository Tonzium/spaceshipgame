<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starship Dodger</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    // Get canvas and context
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Game variables
    let score = 0;
    let gameOver = false;
    let namePrompted = false; // flag to ensure the prompt appears only once
    let obstacleInterval = 500; // milliseconds between obstacles
    let lastObstacleTime = 0;
    const obstacles = [];
    const stars = [];
    const numStars = 150;
    const planets = [];
    const numPlanets = 3;
    
    // Pre-populated leaderboard (top 10)
    const leaderboard = [
      { name: "Alice", score: 1600 },
      { name: "Bob", score: 1500 },
      { name: "Charlie", score: 1400 },
      { name: "David", score: 1350 },
      { name: "Eve", score: 1000 },
      { name: "Frank", score: 900 },
      { name: "Grace", score: 800 },
      { name: "Heidi", score: 700 },
      { name: "Ivan", score: 600 },
      { name: "Judy", score: 500 }
    ];
    
    // New game speed variable which increases over time to ramp up difficulty
    let gameSpeed = 2;

    // Starship properties
    const ship = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      width: 40,
      height: 60,
      speed: 7,
      movingLeft: false,
      movingRight: false
    };

    // Set up keyboard listeners
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        ship.movingLeft = true;
      } else if (e.key === "ArrowRight") {
        ship.movingRight = true;
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") {
        ship.movingLeft = false;
      } else if (e.key === "ArrowRight") {
        ship.movingRight = false;
      }
    });

    // Create background stars (decorative only)
    function createStars() {
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.3 + 0.2
        });
      }
    }

    // Create background planets (placed in the upper half)
    function createPlanets() {
      for (let i = 0; i < numPlanets; i++) {
        planets.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.5,
          radius: Math.random() * 30 + 20,
          color: `hsl(${Math.floor(Math.random() * 360)}, 70%, 50%)`,
          speed: Math.random() * 0.1 + 0.05
        });
      }
    }

    // Draw background: stars and planets
    function drawBackground() {
      // Draw stars (decorative only)
      ctx.fillStyle = "white";
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      // Draw planets
      planets.forEach(planet => {
        ctx.beginPath();
        ctx.fillStyle = planet.color;
        ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Update background stars (for a subtle falling effect)
    function updateStars(deltaTime) {
      stars.forEach(star => {
        star.y += star.speed * deltaTime * 0.05 * gameSpeed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      });
      planets.forEach(planet => {
        planet.y += planet.speed * deltaTime * gameSpeed;
        if (planet.y - planet.radius > canvas.height) {
          planet.y = -planet.radius;
          planet.x = Math.random() * canvas.width;
        }
      });
    }

    // Draw the player's starship as a triangle
    function drawShip() {
      ctx.fillStyle = "cyan";
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y);
      ctx.lineTo(ship.x - ship.width / 2, ship.y + ship.height);
      ctx.lineTo(ship.x + ship.width / 2, ship.y + ship.height);
      ctx.closePath();
      ctx.fill();
    }

    // Create obstacles (stones/asteroids)
    function createObstacle() {
      const size = Math.random() * 20 + 20;
      const type = Math.random() < 0.5 ? "rock" : "asteroid";
      obstacles.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        size: size,
        speed: Math.random() * 2 + 2, // random base speed for each obstacle
        type: type,
        color: type === "rock" ? "grey" : "brown"
      });
    }

    // Draw obstacles
    function drawObstacles() {
      obstacles.forEach(ob => {
        ctx.fillStyle = ob.color;
        if (ob.type === "asteroid") {
          ctx.beginPath();
          ctx.arc(ob.x + ob.size / 2, ob.y + ob.size / 2, ob.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(ob.x, ob.y, ob.size, ob.size);
        }
      });
    }

    // Update obstacles
    function updateObstacles(deltaTime) {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += obstacles[i].speed * deltaTime * 0.05 * gameSpeed;
        if (obstacles[i].y > canvas.height) {
          obstacles.splice(i, 1);
        }
      }
    }

    // Helper function for rectangle collision detection
    function isCollidingRect(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // Collision detection for obstacles using bounding boxes
    function isColliding(ob) {
      const shipRect = {
        x: ship.x - ship.width / 2,
        y: ship.y,
        width: ship.width,
        height: ship.height
      };
      const obRect = {
        x: ob.x,
        y: ob.y,
        width: ob.size,
        height: ob.size
      };
      return isCollidingRect(shipRect, obRect);
    }

    // Collision detection for planets using bounding boxes
    function isCollidingPlanet(planet) {
      const shipRect = {
        x: ship.x - ship.width / 2,
        y: ship.y,
        width: ship.width,
        height: ship.height
      };
      const planetRect = {
        x: planet.x - planet.radius,
        y: planet.y - planet.radius,
        width: planet.radius * 2,
        height: planet.radius * 2
      };
      return isCollidingRect(shipRect, planetRect);
    }

    // Draw score on top right
    function drawScore() {
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + Math.floor(score), canvas.width - 120, 30);
    }

    // Display game over message and leaderboard
    function drawGameOver() {
      ctx.fillStyle = "red";
      ctx.font = "50px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 100);
      ctx.font = "30px Arial";
      ctx.fillText("Final Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 - 50);

      // Draw the leaderboard
      ctx.fillStyle = "white";
      ctx.font = "25px Arial";
      ctx.fillText("Leaderboard", canvas.width / 2, canvas.height / 2);
      for (let i = 0; i < leaderboard.length; i++) {
         let entry = leaderboard[i];
         ctx.fillText((i + 1) + ". " + entry.name + " - " + entry.score, canvas.width / 2, canvas.height / 2 + 40 + i * 30);
      }
    }

    // Restart the game by resetting variables and starting the game loop again
    function restartGame() {
      score = 0;
      gameOver = false;
      namePrompted = false;
      // Reset game speed back to normal
      gameSpeed = 2;
      // Clear obstacles, stars, and planets arrays and reinitialize them for new random positions
      obstacles.length = 0;
      stars.length = 0;
      planets.length = 0;
      createStars();
      createPlanets();
      ship.x = canvas.width / 2;
      lastObstacleTime = performance.now();
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // Game loop
    let lastTime = performance.now();
    function gameLoop(currentTime) {
      const deltaTime = currentTime - lastTime;
      lastTime = currentTime;
      if (gameOver) {
        drawGameOver();
        if (!namePrompted) {
          const finalScore = Math.floor(score);
          // Check if player's score qualifies for the leaderboard (top 10)
          let qualifies = leaderboard.length < 10 || finalScore > leaderboard[leaderboard.length - 1].score;
          if (qualifies) {
            let playerName = prompt("Congratulations! You made it to the leaderboard! Please enter your name:");
            if (!playerName) {
              playerName = "Anonymous";
            }
            leaderboard.push({ name: playerName, score: finalScore });
            leaderboard.sort((a, b) => b.score - a.score);
            if (leaderboard.length > 10) {
              leaderboard.length = 10;
            }
          }
          namePrompted = true;
          // Restart the game after a short delay so the player can see their final score
          setTimeout(restartGame, 1000);
        }
        return;
      }
      
      // Increase score and game speed continuously
      score += deltaTime * 0.01;
      gameSpeed += deltaTime * 0.0001;
      
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Update and draw background elements
      updateStars(deltaTime);
      drawBackground();
      
      // Update ship position based on user input
      if (ship.movingLeft) {
        ship.x -= ship.speed;
        if (ship.x - ship.width / 2 < 0) {
          ship.x = ship.width / 2;
        }
      }
      if (ship.movingRight) {
        ship.x += ship.speed;
        if (ship.x + ship.width / 2 > canvas.width) {
          ship.x = canvas.width - ship.width / 2;
        }
      }
      drawShip();
      
      // Create obstacles at intervals
      if (currentTime - lastObstacleTime > obstacleInterval) {
        createObstacle();
        lastObstacleTime = currentTime;
      }
      
      // Update and draw obstacles
      updateObstacles(deltaTime);
      drawObstacles();
      
      // Check collisions with obstacles and planets
      obstacles.forEach(ob => {
        if (isColliding(ob)) {
          gameOver = true;
        }
      });
      planets.forEach(planet => {
        if (isCollidingPlanet(planet)) {
          gameOver = true;
        }
      });
      
      // Draw score
      drawScore();
      
      requestAnimationFrame(gameLoop);
    }

    // Initialize background elements
    createStars();
    createPlanets();
    
    // Start the game loop
    requestAnimationFrame(gameLoop);

    // Adjust canvas size on window resize
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ship.y = canvas.height - 80;
    });
  </script>
</body>
</html>
